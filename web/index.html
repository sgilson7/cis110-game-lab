<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. A meta policy cannot stop data
       leaving by navigation, so the browser check still watches requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="CIS 110 Collaborative Game Design Project: what to submit, when it's due, how to set up your shared Microsoft 365 folder, and how the project is graded.">
  <title>Collaborative Game Design Project · CIS 110</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap top-row">
      <p class="brand"><span class="chip">CIS 110</span> <span id="course"></span></p>
      <nav id="nav" aria-label="Sections"></nav>
    </div>
  </header>
  <main id="main" class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-text">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <div id="intro"></div>
        <p class="note mono" id="intro-note"></p>
      </div>
      <aside class="next" id="next" aria-label="Next checkpoint"></aside>
    </section>
    <section class="stats" id="stats" aria-label="The project in numbers"></section>
    <div id="sections"></div>
    <p id="message" role="status"></p>
  </main>
  <footer class="wrap" id="footer"></footer>
  <noscript><p class="wrap">This page needs JavaScript and WebAssembly. The same information is in the course syllabus in Blackboard.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
